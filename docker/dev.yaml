services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
    ports:
      - "127.0.0.1:${DYNAMODB_DEV_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 2 http://127.0.0.1:8000/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  seed:
    image: amazon/aws-cli:2.27.41
    depends_on:
      dynamodb-local:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/seed-dynamodb.sh"]
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
    volumes:
      - ../scripts/seed-dynamodb.sh:/scripts/seed-dynamodb.sh:ro
      - ./fixtures:/fixtures:ro

