services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "127.0.0.1:${DYNAMODB_LOCAL_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null --max-time 2 http://127.0.0.1:8000/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
